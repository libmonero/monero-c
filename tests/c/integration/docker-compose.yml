# regtest node and wallet RPC server for the integration tests, from the images of libmonero/docker-monero-rpc, which are built from the
# same fork of monero as monero-cpp. MONERO_TAG pins them, for example MONERO_TAG=v0.18.5.1-1
services:

  node:
    image: ghcr.io/libmonero/monero-daemon-rpc:${MONERO_TAG:-master}
    container_name: monero_c_node
    # --fixed-difficulty: otherwise the difficulty grows about 10x per block, and generateblocks times out
    # the entrypoint is monerod --non-interactive
    command: [
      "--regtest",
      "--offline",
      "--fixed-difficulty=1",
      "--log-level=0",
      "--hide-my-port",
      "--no-zmq",
      "--rpc-bind-ip=0.0.0.0",
      "--rpc-bind-port=18081",
      "--rpc-access-control-origins=*",
      "--rpc-ssl=disabled",
      "--disable-rpc-ban",
      "--confirm-external-bind"
    ]
    ports:
      - "18081:18081"
      # the wallet RPC server shares the network of the node, so its port is published here
      - "18082:18082"
    restart: "no"

  wallet_rpc:
    image: ghcr.io/libmonero/monero-wallet-rpc:${MONERO_TAG:-master}
    container_name: monero_c_wallet_rpc
    # the tests give the server the daemon URI http://127.0.0.1:18081, which reaches monerod on this network
    network_mode: "service:node"
    # the entrypoint is monero-wallet-rpc
    command: [
      "--daemon-address=127.0.0.1:18081",
      "--trusted-daemon",
      "--allow-mismatched-daemon-version",
      "--rpc-bind-ip=0.0.0.0",
      "--rpc-bind-port=18082",
      "--confirm-external-bind",
      "--disable-rpc-login",
      "--rpc-access-control-origins=*",
      "--wallet-dir=/home/monero/wallets",
      "--non-interactive"
    ]
    volumes:
      - wallet_rpc_data:/home/monero/wallets
    depends_on:
      - node
    restart: "no"

volumes:
  wallet_rpc_data:
