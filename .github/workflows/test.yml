name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  wait-build:
    name: Pending
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    outputs:
      run-id: ${{ steps.wait.outputs.run-id }}

    steps:
      - name: Wait for the Build run of this commit
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          RUN_ID=""
          for _ in $(seq 1 30); do
            RUN_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?head_sha=$SHA&event=$EVENT&per_page=1" --jq '.workflow_runs[0].id // empty' || true)
            if [ -n "$RUN_ID" ]; then break; fi
            sleep 20
          done
          if [ -z "$RUN_ID" ]; then echo "no Build run for $SHA"; exit 1; fi
          until [ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .status || true)" = "completed" ]; do
            sleep 60
          done
          CONCLUSION=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .conclusion)
          if [ "$CONCLUSION" != "success" ]; then
            echo "Build run $RUN_ID concluded with $CONCLUSION"; exit 1
          fi
          MISSING=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq '
            [.artifacts[] | select(.expired | not) | .name] as $available |
            ["monero-c-linux-x86_64", "monero-c-linux-arm64", "monero-c-mac-x86_64", "monero-c-mac-arm64", "monero-c-windows", "monero-native-nuget"] |
            map(select(. as $name | $available | index($name) == null)) | .[]')
          if [ -n "$MISSING" ]; then
            echo "Build run $RUN_ID is missing required artifacts:"
            echo "$MISSING"
            exit 1
          fi
          echo "run-id=$RUN_ID" >> "$GITHUB_OUTPUT"

  unit:
    name: Unit tests
    needs: wait-build
    uses: ./.github/workflows/unit-tests.yml
    with:
      run-id: ${{ needs.wait-build.outputs.run-id }}

  integration:
    name: Integration tests
    needs: wait-build
    uses: ./.github/workflows/integration-tests.yml
    with:
      run-id: ${{ needs.wait-build.outputs.run-id }}

  dotnet:
    name: .NET tests
    needs: wait-build
    uses: ./.github/workflows/dotnet-tests.yml
    with:
      run-id: ${{ needs.wait-build.outputs.run-id }}
