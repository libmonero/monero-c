# Builds the library for each platform in its own workflow, build-linux.yml, build-macos.yml,
# build-windows.yml and build-android.yml, and packages the result. The checks on the built library are in test.yml
name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux
    uses: ./.github/workflows/build-linux.yml

  macos:
    name: macOS
    uses: ./.github/workflows/build-macos.yml

  windows:
    name: Windows
    uses: ./.github/workflows/build-windows.yml

  android:
    name: Android
    uses: ./.github/workflows/build-android.yml

  docs:
    name: docs
    # builds the docs on pull requests, publishes them with the coverage report from main only
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: linux
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml

  dotnet:
    name: .NET package
    needs: [linux, macos, windows]
    permissions:
      contents: read
    uses: ./.github/workflows/dotnet.yml

  android-aar:
    name: Android archive
    needs: [linux, android]
    permissions:
      contents: read
    uses: ./.github/workflows/android-aar.yml

  jvm:
    name: JVM archive
    needs: [linux, macos, windows]
    permissions:
      contents: read
    uses: ./.github/workflows/jvm.yml

  release:
    name: Release
    # a tag v* ends in a draft release with the libraries and the packages; publishing the draft pushes the package to nuget.org
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: [linux, macos, windows, android, dotnet, android-aar, jvm]
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release.yml
