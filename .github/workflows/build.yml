# Builds the library for each platform in its own workflow, build-linux.yml, build-macos.yml and
# build-windows.yml, and packages the result
name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux
    uses: ./.github/workflows/build-linux.yml

  macos:
    name: macOS
    uses: ./.github/workflows/build-macos.yml

  windows:
    name: Windows
    uses: ./.github/workflows/build-windows.yml

  docs:
    name: docs
    # builds the docs on pull requests, publishes them with the coverage report from main only
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: linux
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml

  dotnet:
    name: .NET package
    needs: [linux, macos, windows]
    permissions:
      contents: read
    uses: ./.github/workflows/dotnet.yml
