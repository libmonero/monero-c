# Builds the library for each platform in its own workflow, build-linux.yml, build-macos.yml,
# build-windows.yml and build-android.yml, checks what the libraries link against and export, and packages the result.
# The tests that run the libraries are in unit-tests.yml and integration-tests.yml
name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the run of the one before, which nobody reads: Unit tests and Integration tests do it already, and Build, which
# costs the most, did not. The runs of main and of the tags have a group of their own, so none of them is ever cancelled
concurrency:
  group: build-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux
    uses: ./.github/workflows/build-linux.yml

  macos:
    name: macOS
    uses: ./.github/workflows/build-macos.yml

  windows:
    name: Windows
    uses: ./.github/workflows/build-windows.yml

  android:
    name: Android
    uses: ./.github/workflows/build-android.yml

  library:
    name: Library checks
    needs: [linux, macos, windows]
    uses: ./.github/workflows/library-checks.yml

  dotnet:
    name: .NET package
    needs: [linux, macos, windows]
    permissions:
      contents: read
    uses: ./.github/workflows/dotnet.yml

  android-aar:
    name: Android archive
    needs: [linux, android]
    permissions:
      contents: read
    uses: ./.github/workflows/android-aar.yml

  jvm:
    name: JVM archive
    needs: [linux, macos, windows]
    permissions:
      contents: read
    uses: ./.github/workflows/jvm.yml

  dart:
    name: Dart package
    needs: [linux, macos, windows, android]
    permissions:
      contents: read
    uses: ./.github/workflows/dart.yml

  apple:
    name: Apple XCFramework
    needs: [linux, macos]
    permissions:
      contents: read
    uses: ./.github/workflows/apple.yml

  release:
    name: Release
    # a tag v* ends in a draft release with the libraries and the packages; publishing the draft pushes the package to nuget.org
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: [linux, macos, windows, android, library, dotnet, android-aar, jvm, dart, apple]
    permissions:
      contents: write
      actions: read
      attestations: write
      id-token: write
    uses: ./.github/workflows/release.yml
