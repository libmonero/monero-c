# The Linux build of the library. Called by build.yml. Pull requests and main also build the variants with coverage and with the sanitizers, which
# unit-tests.yml and integration-tests.yml run
name: Build Linux

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.cpu }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    # debian:12 provides a supported build environment. The library needs glibc 2.34, see the unbound step
    container: ${{ matrix.container }}
    env:
      # the variants with coverage and with the sanitizers are built on pull requests and on main
      INSTRUMENTED: ${{ matrix.arch == 'linux-x86_64' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
      # the job runs as root in the container, and github.workspace is not the path of the workspace in it
      CCACHE_DIR: /root/.ccache
      # every project gets ccache as the compiler launcher, and monero-project's own detection of it is turned off, so that it is not wrapped twice
      CMAKE_CCACHE: -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPRESS: "1"

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            container: debian:12
            arch: linux-x86_64
            cpu: x86_64
            march: x86-64
          - os: ubuntu-24.04-arm
            container: debian:12
            arch: linux-arm64
            cpu: arm64
            march: armv8-a

    steps:
      # actions/cache compresses with zstd when the job has it, and with gzip when it does not, and it looks a cache up by the compression that
      # the job has at that moment. zstd is installed here, before the cache is restored, so that a cache is saved and restored with the same one
      - name: Install git and zstd
        timeout-minutes: 15
        run: |
          # a run of Linux arm64 stayed on this step for more than 30 minutes (run 42739498377). apt tries again, over IPv4, with timeouts, and a try that hangs
          # is stopped and made again
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::ForceIPv4 "true";\n' > /etc/apt/apt.conf.d/80-ci
          for attempt in 1 2 3; do
            timeout 300 apt-get update && timeout 900 apt-get install -y git ca-certificates zstd && break
            [ "$attempt" -lt 3 ] || { echo "apt failed three times"; exit 1; }
            echo "apt failed, a new try in 20 seconds"; sleep 20
          done
          git config --global --add safe.directory '*'

      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive

      - name: Set compiler hardening flags
        run: |
          flags="-O2 -fstack-protector-strong -D_FORTIFY_SOURCE=2 -fstack-clash-protection"
          if [ "${{ matrix.arch }}" = "linux-x86_64" ]; then
            flags="$flags -fcf-protection=full"
          fi
          echo "CFLAGS=$flags" >> "$GITHUB_ENV"
          echo "CXXFLAGS=$flags -D_GLIBCXX_ASSERTIONS" >> "$GITHUB_ENV"

      - name: Install dependencies
        timeout-minutes: 20
        run: |
          for attempt in 1 2 3; do
            timeout 900 apt-get install -y build-essential cmake pkg-config file perl wget libzmq3-dev libunbound-dev libsodium-dev libunwind-dev liblzma-dev libreadline-dev libexpat1-dev libpgm-dev libhidapi-dev libusb-1.0-0-dev libprotobuf-dev protobuf-compiler libudev-dev python3 ccache git curl autoconf libtool gperf bison flex nettle-dev libevent-dev && break
            [ "$attempt" -lt 3 ] || { echo "apt failed three times"; exit 1; }
            echo "apt failed, a new try in 20 seconds"; sleep 20
          done
          # record versions of the distro libraries that get statically linked into the shipped binary
          dpkg -s libsodium-dev libprotobuf-dev | grep -E '^(Package|Version)'

      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /root/.ccache
          key: ccache-${{ matrix.arch }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ matrix.arch }}-

      # the statistics are kept in the cache directory, so reset them to see what this run did
      - name: Reset the ccache statistics
        run: ccache --zero-stats

      - name: Install openssl
        run: |
          # ccache wraps gcc and g++, which the links in /usr/lib/ccache stand for
          export PATH=/usr/lib/ccache:$PATH
          # build the current openssl LTS statically (/etc/ssl matches most distros' CA layout)
          wget --tries=5 --waitretry=5 --timeout=30 --retry-on-http-error=500,502,503,504 https://github.com/openssl/openssl/releases/download/openssl-3.5.7/openssl-3.5.7.tar.gz
          echo "a8c0d28a529ca480f9f36cf5792e2cd21984552a3c8e4aa11a24aa31aeac98e8  openssl-3.5.7.tar.gz" | sha256sum -c
          tar xzf openssl-3.5.7.tar.gz
          cd openssl-3.5.7
          ./config --prefix=/usr/local --openssldir=/etc/ssl --libdir=lib no-shared no-tests -fPIC
          make -j3
          make install_sw

      - name: Install expat
        run: |
          # ccache wraps gcc and g++, which the links in /usr/lib/ccache stand for
          export PATH=/usr/lib/ccache:$PATH
          wget --tries=5 --waitretry=5 --timeout=30 --retry-on-http-error=500,502,503,504 https://github.com/libexpat/libexpat/releases/download/R_2_7_1/expat-2.7.1.tar.bz2
          echo "45c98ae1e9b5127325d25186cf8c511fa814078e9efeae7987a574b482b79b3d  expat-2.7.1.tar.bz2" | sha256sum -c
          tar -xf expat-2.7.1.tar.bz2
          cd expat-2.7.1
          ./configure --enable-static --disable-shared --with-pic
          make
          make install

      - name: Install unbound
        run: |
          # ccache wraps gcc and g++, which the links in /usr/lib/ccache stand for
          export PATH=/usr/lib/ccache:$PATH
          wget --tries=5 --waitretry=5 --timeout=30 --retry-on-http-error=500,502,503,504 https://www.nlnetlabs.nl/downloads/unbound/unbound-1.22.0.tar.gz
          echo "c5dd1bdef5d5685b2cedb749158dd152c52d44f65529a34ac15cd88d4b1b3d43  unbound-1.22.0.tar.gz" | sha256sum -c
          tar xzf unbound-1.22.0.tar.gz
          cd unbound-1.22.0
          # arc4random and arc4random_uniform are in glibc 2.36, and the ones that unbound finds there would make the library need it.
          # Without them it builds its own, and the next highest version of the library is 2.34
          ./configure --with-libexpat=/usr/local --with-ssl=/usr/local --enable-static --disable-shared --with-pic ac_cv_func_arc4random=no ac_cv_func_arc4random_uniform=no
          make
          make install

      - name: Install libusb
        run: |
          # ccache wraps gcc and g++, which the links in /usr/lib/ccache stand for
          export PATH=/usr/lib/ccache:$PATH
          wget --tries=5 --waitretry=5 --timeout=30 --retry-on-http-error=500,502,503,504 https://github.com/libusb/libusb/releases/download/v1.0.27/libusb-1.0.27.tar.bz2
          echo "ffaa41d741a8a3bee244ac8e54a72ea05bf2879663c098c82fc5757853441575  libusb-1.0.27.tar.bz2" | sha256sum -c
          tar -xf libusb-1.0.27.tar.bz2
          cd libusb-1.0.27
          ./configure --disable-static --enable-shared --disable-udev --with-pic
          make
          make install
          test -s /usr/local/lib/libusb-1.0.so.0

      - name: Install hidapi
        run: |
          wget --tries=5 --waitretry=5 --timeout=30 --retry-on-http-error=500,502,503,504 https://github.com/libusb/hidapi/archive/refs/tags/hidapi-0.14.0.tar.gz
          echo "a5714234abe6e1f53647dd8cba7d69f65f71c558b7896ed218864ffcf405bcbd  hidapi-0.14.0.tar.gz" | sha256sum -c
          tar xzf hidapi-0.14.0.tar.gz
          cd hidapi-hidapi-0.14.0
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS="$CFLAGS" -DCMAKE_CXX_FLAGS="$CXXFLAGS" -DBUILD_SHARED_LIBS=OFF -DHIDAPI_WITH_HIDRAW=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DCMAKE_POLICY_VERSION_MINIMUM=3.5 .
          cmake --build build
          cmake --install build

      # Boost is the same on every run, and ccache only helps with its compilation, not with the download, the extraction and the installation of
      # its headers. So it is installed in a directory of its own, which is cached, and then copied to /usr/local.
      # The number of the key is raised when the options of b2 change
      - name: Restore boost
        id: boost
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: boost-install
          key: boost-1.85.0-${{ matrix.arch }}-2

      - name: Install boost
        if: steps.boost.outputs.cache-hit != 'true'
        run: |
          # ccache wraps gcc and g++, which the links in /usr/lib/ccache stand for
          export PATH=/usr/lib/ccache:$PATH
          # PIC static boost, same version on all platforms (no distro boost so headers and archives match)
          wget --tries=5 --waitretry=5 --timeout=30 --retry-on-http-error=500,502,503,504 https://archives.boost.io/release/1.85.0/source/boost_1_85_0.tar.bz2
          echo "7009fe1faa1697476bdc7027703a2badb84e849b7b0baad5086b087b971f8617  boost_1_85_0.tar.bz2" | sha256sum -c
          tar xf boost_1_85_0.tar.bz2
          cd boost_1_85_0
          ./bootstrap.sh --with-libraries=chrono,date_time,filesystem,locale,program_options,regex,serialization,system,thread
          ./b2 -j3 --prefix="$GITHUB_WORKSPACE/boost-install" cxxflags="-fPIC $CXXFLAGS" cflags="-fPIC $CFLAGS" link=static runtime-link=shared boost.locale.icu=off install
          # the license goes with the files, because the source is not extracted when they come from the cache
          mkdir -p "$GITHUB_WORKSPACE/boost-install/share/doc/boost"
          cp LICENSE_1_0.txt "$GITHUB_WORKSPACE/boost-install/share/doc/boost/"

      # only main saves, as it does for ccache. The cache is saved here and not at the end, so that a later failure does not lose it
      - name: Save boost
        if: ${{ steps.boost.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: boost-install
          key: boost-1.85.0-${{ matrix.arch }}-2

      - name: Put boost in /usr/local
        run: cp -R boost-install/. /usr/local/

      - name: Build monero-project
        run: |
          cd external/monero-cpp/external/monero-project
          mkdir -p build/release
          cd build/release
          cmake -DSTATIC=ON -DBUILD_64=ON -DARCH="${{ matrix.march }}" -DCMAKE_BUILD_TYPE=Release -DUSE_DEVICE_TREZOR=OFF $CMAKE_CCACHE -DUSE_CCACHE=OFF ../../
          make -j3 wallet cryptonote_protocol
          cd ../../../../../../

      - name: Build monero-cpp libraries
        run: |
          cd external/monero-cpp
          mkdir -p build
          cd build
          cmake -DBUILD_LIBRARY=ON -DBUILD_SAMPLE=OFF -DBUILD_SCRATCHPAD=OFF -DBUILD_TESTS=OFF -DBOOST_ROOT=/usr/local -DBoost_NO_SYSTEM_PATHS=ON $CMAKE_CCACHE ..
          cmake --build . --target monero-cpp-static -j3
          cd ../../..

      - name: Build monero-c library
        run: |
          mkdir -p build
          cd build
          cmake -DBUILD_TESTS=ON -DMONERO_C_STATIC_DEPENDENCIES=ON -DMONERO_C_LIBUSB_SHARED_LIBRARY:FILEPATH=/usr/local/lib/libusb-1.0.so -DBOOST_ROOT=/usr/local -DBoost_NO_SYSTEM_PATHS=ON $CMAKE_CCACHE ..
          grep -Fxq 'MONERO_C_LIBUSB_SHARED_LIBRARY:FILEPATH=/usr/local/lib/libusb-1.0.so' CMakeCache.txt
          cmake --build . -j3
          cd ..

      - name: Stage monero-c build
        run: |
          mkdir -p dist
          mkdir -p dist/licenses
          cp external/monero-cpp/LICENSE.txt dist/licenses/monero-cpp-MIT.txt
          cp external/monero-cpp/external/monero-project/LICENSE dist/licenses/monero-project-BSD-3-Clause.txt
          cp external/monero-cpp/external/monero-project/contrib/epee/LICENSE.txt dist/licenses/epee-BSD-3-Clause.txt
          cp external/monero-cpp/external/monero-project/external/randomx/LICENSE dist/licenses/randomx-BSD-3-Clause.txt
          cp external/monero-cpp/external/monero-project/external/db_drivers/liblmdb/LICENSE dist/licenses/lmdb-OLDAP-2.8.txt
          cp external/monero-cpp/external/monero-project/external/rapidjson/license.txt dist/licenses/rapidjson-MIT.txt
          cp boost-install/share/doc/boost/LICENSE_1_0.txt dist/licenses/boost-BSL-1.0.txt
          cp openssl-3.5.7/LICENSE.txt dist/licenses/openssl-Apache-2.0.txt
          cp expat-2.7.1/COPYING dist/licenses/expat-MIT.txt
          cp unbound-1.22.0/LICENSE dist/licenses/unbound-BSD-3-Clause.txt
          cp libusb-1.0.27/COPYING dist/licenses/libusb-LGPL-2.1.txt
          mkdir -p dist/licenses/source
          cp libusb-1.0.27.tar.bz2 dist/licenses/source/
          cp hidapi-hidapi-0.14.0/LICENSE-bsd.txt dist/licenses/hidapi-BSD-3-Clause.txt
          cp /usr/share/doc/libsodium-dev/copyright dist/licenses/libsodium-ISC.txt
          cp /usr/share/doc/libprotobuf-dev/copyright dist/licenses/protobuf-BSD-3-Clause.txt
          cp /usr/share/doc/libevent-dev/copyright dist/licenses/libevent-BSD-3-Clause.txt
          cp build/libmonero_c.so dist/
          cp -L /usr/local/lib/libusb-1.0.so.0 dist/
          cp build/tests/c/unit/monero_c_utils_unit_tests build/tests/c/unit/monero_c_daemon_unit_tests build/tests/c/integration/monero_c_daemon_integration_tests dist/
          cp build/tests/c/unit/monero_c_wallet_unit_tests build/tests/c/unit/monero_c_wallet_keys_unit_tests build/tests/c/unit/monero_c_wallet_offline_unit_tests build/tests/c/unit/monero_c_wallet_multisig_unit_tests build/tests/c/unit/monero_c_rpc_connection_unit_tests build/tests/c/unit/monero_c_abi_unit_tests build/tests/c/unit/monero_c_arguments_unit_tests build/tests/c/unit/monero_c_fuzz_unit_tests build/tests/c/unit/monero_c_threads_unit_tests build/tests/c/unit/monero_c_cpp_unit_tests build/tests/c/integration/monero_c_wallet_integration_tests dist/

      - name: Upload monero-c build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: monero-c-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

      - name: Strip library for the Debian package
        run: strip --strip-unneeded build/libmonero_c.so

      # the install rules: a program finds the installed library with CMake and with pkg-config, and the .deb has the library and what it needs.
      # Only the paths of the install change, so the build is not compiled again
      - name: Install the library and use it
        run: |
          multiarch=$(dpkg-architecture -qDEB_HOST_MULTIARCH)
          abi=$(awk '/#define MONERO_C_ABI_VERSION_(MAJOR|MINOR|PATCH)/ {printf "%s%s", sep, $3; sep="."}' src/utils/monero_c_utils.h)
          cmake -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_INSTALL_LIBDIR=lib/$multiarch -DMONERO_C_LICENSES_DIR="$PWD/dist/licenses" build
          cmake --install build --prefix "$PWD/install-test"
          cmake -S packaging/cmake/test -B build-consumer -DCMAKE_PREFIX_PATH="$PWD/install-test"
          cmake --build build-consumer
          ./build-consumer/consumer "$abi"
          cc packaging/cmake/test/main.c $(PKG_CONFIG_PATH="$PWD/install-test/lib/$multiarch/pkgconfig" pkg-config --cflags --libs monero_c) -Wl,-rpath,"$PWD/install-test/lib/$multiarch" -o consumer-pc
          ./consumer-pc "$abi"

      - name: Make the .deb package
        run: |
          (cd build && cpack -G DEB)
          deb=$(ls build/monero-c_*.deb)
          dpkg-deb -I "$deb"
          dpkg-deb -c "$deb"
          # GitHub changes the ~ of a file name, and the checksums of the release list the name that the file has here
          version=$(dpkg-deb -f "$deb" Version | tr '~' '-')
          mkdir -p deb
          cp "$deb" "deb/monero-c_${version}_$(dpkg --print-architecture).deb"

      - name: Upload the .deb package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: monero-native-deb-${{ matrix.cpu }}
          path: deb/
          if-no-files-found: error
          retention-days: 1

      # the tests of these variants run in other workflows, in the same image and at the same paths as here, which the notes of gcov and the
      # RUNPATH of the tests need. Only what they run is staged
      - name: Build monero-c with coverage
        if: env.INSTRUMENTED == 'true'
        run: |
          cmake -S . -B build-coverage -DBUILD_TESTS=ON -DENABLE_COVERAGE=ON -DBOOST_ROOT=/usr/local -DBoost_NO_SYSTEM_PATHS=ON $CMAKE_CCACHE
          cmake --build build-coverage -j3

      - name: Stage the coverage build
        if: env.INSTRUMENTED == 'true'
        run: |
          mkdir stage-coverage
          find build-coverage -type f \( -name '*.gcno' -o -name libmonero_c.so -o -name 'monero_c_*_unit_tests' -o -name 'monero_c_*_integration_tests' \) ! -name monero_c_static_unit_tests -exec cp --parents {} stage-coverage/ \;

      - name: Upload the coverage build
        if: env.INSTRUMENTED == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-coverage-linux-x86_64
          path: stage-coverage/
          if-no-files-found: error
          retention-days: 1

      # sanitizers on monero_c only, the static archives aren't instrumented
      - name: Build monero-c with sanitizers
        if: env.INSTRUMENTED == 'true'
        run: |
          flags="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined"
          cmake -S . -B build-sanitizers -DBUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug -DBOOST_ROOT=/usr/local -DBoost_NO_SYSTEM_PATHS=ON $CMAKE_CCACHE \
            "-DCMAKE_C_FLAGS=$flags" "-DCMAKE_CXX_FLAGS=$flags" \
            "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined" "-DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=address,undefined"
          cmake --build build-sanitizers -j3

      - name: Stage the sanitizers build
        if: env.INSTRUMENTED == 'true'
        run: |
          mkdir stage-sanitizers
          find build-sanitizers -type f \( -name libmonero_c.so -o -name 'monero_c_*_unit_tests' -o -name 'monero_c_*_integration_tests' \) ! -name monero_c_static_unit_tests -exec cp --parents {} stage-sanitizers/ \;

      - name: Upload the sanitizers build
        if: env.INSTRUMENTED == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-sanitizers-linux-x86_64
          path: stage-sanitizers/
          if-no-files-found: error
          retention-days: 1

      - name: Show the ccache statistics
        if: ${{ !cancelled() }}
        run: ccache --show-stats

      # only main saves, so that the caches of the pull requests don't evict the one that every pull request restores
      - name: Save ccache
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /root/.ccache
          key: ccache-${{ matrix.arch }}-${{ github.run_id }}
