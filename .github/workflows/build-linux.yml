# The Linux build of the library. Called by build.yml. Pull requests and main also run the coverage and the sanitizers
name: Build Linux

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.cpu }}
    runs-on: ${{ matrix.os }}
    # debian:12 provides a supported build environment with a glibc 2.36 baseline
    container: ${{ matrix.container }}
    env:
      # coverage runs on pull requests and on main
      COVERAGE: ${{ matrix.arch == 'linux-x86_64' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            container: debian:12
            arch: linux-x86_64
            cpu: x86_64
            march: x86-64
            filearch: x86-64
            glibc_floor: GLIBC_2.36
          - os: ubuntu-24.04-arm
            container: debian:12
            arch: linux-arm64
            cpu: arm64
            march: armv8-a
            filearch: aarch64
            glibc_floor: GLIBC_2.36

    steps:
      - name: Install git
        run: |
          apt-get update
          apt-get install -y git ca-certificates
          git config --global --add safe.directory '*'

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          apt-get install -y build-essential cmake pkg-config file perl wget libzmq3-dev libunbound-dev libsodium-dev libunwind-dev liblzma-dev libreadline-dev libexpat1-dev libpgm-dev libhidapi-dev libusb-1.0-0-dev libprotobuf-dev protobuf-compiler libudev-dev python3 ccache git curl autoconf libtool gperf bison flex nettle-dev libevent-dev
          # record versions of the distro libraries that get statically linked into the shipped binary
          dpkg -s libsodium-dev libprotobuf-dev | grep -E '^(Package|Version)'

      - name: Install openssl
        run: |
          # build the current openssl LTS statically (/etc/ssl matches most distros' CA layout)
          wget --tries=5 --waitretry=5 --timeout=30 --retry-on-http-error=500,502,503,504 https://github.com/openssl/openssl/releases/download/openssl-3.5.7/openssl-3.5.7.tar.gz
          echo "a8c0d28a529ca480f9f36cf5792e2cd21984552a3c8e4aa11a24aa31aeac98e8  openssl-3.5.7.tar.gz" | sha256sum -c
          tar xzf openssl-3.5.7.tar.gz
          cd openssl-3.5.7
          ./config --prefix=/usr/local --openssldir=/etc/ssl --libdir=lib no-shared no-tests -fPIC
          make -j3
          make install_sw

      - name: Install expat
        run: |
          wget --tries=5 --waitretry=5 --timeout=30 --retry-on-http-error=500,502,503,504 https://github.com/libexpat/libexpat/releases/download/R_2_7_1/expat-2.7.1.tar.bz2
          echo "45c98ae1e9b5127325d25186cf8c511fa814078e9efeae7987a574b482b79b3d  expat-2.7.1.tar.bz2" | sha256sum -c
          tar -xf expat-2.7.1.tar.bz2
          cd expat-2.7.1
          ./configure --enable-static --disable-shared --with-pic
          make
          make install

      - name: Install unbound
        run: |
          wget --tries=5 --waitretry=5 --timeout=30 --retry-on-http-error=500,502,503,504 https://www.nlnetlabs.nl/downloads/unbound/unbound-1.22.0.tar.gz
          echo "c5dd1bdef5d5685b2cedb749158dd152c52d44f65529a34ac15cd88d4b1b3d43  unbound-1.22.0.tar.gz" | sha256sum -c
          tar xzf unbound-1.22.0.tar.gz
          cd unbound-1.22.0
          ./configure --with-libexpat=/usr/local --with-ssl=/usr/local --enable-static --disable-shared --with-pic
          make
          make install

      - name: Install libusb
        run: |
          wget --tries=5 --waitretry=5 --timeout=30 --retry-on-http-error=500,502,503,504 https://github.com/libusb/libusb/releases/download/v1.0.27/libusb-1.0.27.tar.bz2
          echo "ffaa41d741a8a3bee244ac8e54a72ea05bf2879663c098c82fc5757853441575  libusb-1.0.27.tar.bz2" | sha256sum -c
          tar -xf libusb-1.0.27.tar.bz2
          cd libusb-1.0.27
          ./configure --disable-static --enable-shared --disable-udev --with-pic
          make
          make install
          test -s /usr/local/lib/libusb-1.0.so.0

      - name: Install hidapi
        run: |
          wget --tries=5 --waitretry=5 --timeout=30 --retry-on-http-error=500,502,503,504 https://github.com/libusb/hidapi/archive/refs/tags/hidapi-0.14.0.tar.gz
          echo "a5714234abe6e1f53647dd8cba7d69f65f71c558b7896ed218864ffcf405bcbd  hidapi-0.14.0.tar.gz" | sha256sum -c
          tar xzf hidapi-0.14.0.tar.gz
          cd hidapi-hidapi-0.14.0
          cmake -B build -DBUILD_SHARED_LIBS=OFF -DHIDAPI_WITH_HIDRAW=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DCMAKE_POLICY_VERSION_MINIMUM=3.5 .
          cmake --build build
          cmake --install build

      - name: Install boost
        run: |
          # PIC static boost, same version on all platforms (no distro boost so headers and archives match)
          wget --tries=5 --waitretry=5 --timeout=30 --retry-on-http-error=500,502,503,504 https://archives.boost.io/release/1.85.0/source/boost_1_85_0.tar.bz2
          echo "7009fe1faa1697476bdc7027703a2badb84e849b7b0baad5086b087b971f8617  boost_1_85_0.tar.bz2" | sha256sum -c
          tar xf boost_1_85_0.tar.bz2
          cd boost_1_85_0
          ./bootstrap.sh --with-libraries=chrono,date_time,filesystem,locale,program_options,regex,serialization,system,thread
          ./b2 -j3 cxxflags=-fPIC cflags=-fPIC link=static runtime-link=shared boost.locale.icu=off install

      - name: Build monero-project
        run: |
          cd external/monero-cpp/external/monero-project
          mkdir -p build/release
          cd build/release
          cmake -DSTATIC=ON -DBUILD_64=ON -DARCH="${{ matrix.march }}" -DCMAKE_BUILD_TYPE=Release -DUSE_DEVICE_TREZOR=OFF ../../
          make -j3 wallet cryptonote_protocol
          cd ../../../../../../

      - name: Build monero-cpp libraries
        run: |
          cd external/monero-cpp
          mkdir -p build
          cd build
          cmake -DBUILD_LIBRARY=ON -DBUILD_SAMPLE=OFF -DBUILD_SCRATCHPAD=OFF -DBUILD_TESTS=OFF -DBOOST_ROOT=/usr/local -DBoost_NO_SYSTEM_PATHS=ON ..
          cmake --build . --target monero-cpp-static -j3
          cd ../../..

      - name: Build monero-c library
        run: |
          mkdir -p build
          cd build
          cmake -DBUILD_TESTS=ON -DMONERO_C_STATIC_DEPENDENCIES=ON -DMONERO_C_LIBUSB_SHARED_LIBRARY:FILEPATH=/usr/local/lib/libusb-1.0.so -DBOOST_ROOT=/usr/local -DBoost_NO_SYSTEM_PATHS=ON ..
          grep -Fxq 'MONERO_C_LIBUSB_SHARED_LIBRARY:FILEPATH=/usr/local/lib/libusb-1.0.so' CMakeCache.txt
          cmake --build . -j3
          cd ..

      - name: Verify native runtime dependencies
        run: |
          file build/libmonero_c.so | grep -q '${{ matrix.filearch }}' || { echo "wrong architecture: $(file build/libmonero_c.so)"; exit 1; }
          floor=$(objdump -T build/libmonero_c.so | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "glibc floor: $floor"
          test -n "$floor" || { echo "could not determine glibc floor"; exit 1; }
          test "$(printf '%s\n${{ matrix.glibc_floor }}\n' "$floor" | sort -V | tail -1)" = "${{ matrix.glibc_floor }}" || { echo "glibc floor $floor exceeds ${{ matrix.glibc_floor }}"; exit 1; }
          ldd_out=$(ldd build/libmonero_c.so)
          echo "$ldd_out"
          unexpected=$(echo "$ldd_out" | awk '/=>/ {print $1} /^\// {name=$1; sub(".*/", "", name); print name}' | grep -Ev '^(linux-vdso\.so\.[0-9]+|libc\.so(\.[0-9]+)*|libm\.so(\.[0-9]+)*|libstdc\+\+\.so(\.[0-9]+)*|libgcc_s\.so(\.[0-9]+)*|libpthread\.so(\.[0-9]+)*|librt\.so(\.[0-9]+)*|libdl\.so(\.[0-9]+)*|ld-linux[^ ]*|libusb-1\.0\.so\.0|libudev\.so\.1)$' || true)
          if [ -n "$unexpected" ]; then
            echo "unexpected non-system runtime dependencies:"
            echo "$unexpected"
            exit 1
          fi
          printf '%s\n' "$ldd_out" | grep -q 'libusb-1.0.so.0 =>' || { echo "libusb is not dynamically linked"; exit 1; }

      - name: Check exported symbols
        run: cmake -DLIBRARY=build/libmonero_c.so -DEXPECTED=tests/c/abi/monero_c.symbols -P tests/c/abi/check_symbols.cmake

      - name: Stage monero-c build
        run: |
          mkdir -p dist
          mkdir -p dist/licenses
          cp external/monero-cpp/LICENSE.txt dist/licenses/monero-cpp-MIT.txt
          cp external/monero-cpp/external/monero-project/LICENSE dist/licenses/monero-project-BSD-3-Clause.txt
          cp external/monero-cpp/external/monero-project/contrib/epee/LICENSE.txt dist/licenses/epee-BSD-3-Clause.txt
          cp external/monero-cpp/external/monero-project/external/randomx/LICENSE dist/licenses/randomx-BSD-3-Clause.txt
          cp external/monero-cpp/external/monero-project/external/db_drivers/liblmdb/LICENSE dist/licenses/lmdb-OLDAP-2.8.txt
          cp external/monero-cpp/external/monero-project/external/rapidjson/license.txt dist/licenses/rapidjson-MIT.txt
          cp boost_1_85_0/LICENSE_1_0.txt dist/licenses/boost-BSL-1.0.txt
          cp openssl-3.5.7/LICENSE.txt dist/licenses/openssl-Apache-2.0.txt
          cp expat-2.7.1/COPYING dist/licenses/expat-MIT.txt
          cp unbound-1.22.0/LICENSE dist/licenses/unbound-BSD-3-Clause.txt
          cp libusb-1.0.27/COPYING dist/licenses/libusb-LGPL-2.1.txt
          mkdir -p dist/licenses/source
          cp libusb-1.0.27.tar.bz2 dist/licenses/source/
          cp hidapi-hidapi-0.14.0/LICENSE-bsd.txt dist/licenses/hidapi-BSD-3-Clause.txt
          cp /usr/share/doc/libsodium-dev/copyright dist/licenses/libsodium-ISC.txt
          cp /usr/share/doc/libprotobuf-dev/copyright dist/licenses/protobuf-BSD-3-Clause.txt
          cp /usr/share/doc/libevent-dev/copyright dist/licenses/libevent-BSD-3-Clause.txt
          cp build/libmonero_c.so dist/
          cp -L /usr/local/lib/libusb-1.0.so.0 dist/
          cp build/tests/c/unit/monero_c_utils_unit_tests build/tests/c/unit/monero_c_daemon_unit_tests build/tests/c/integration/monero_c_daemon_integration_tests dist/
          cp build/tests/c/unit/monero_c_wallet_unit_tests build/tests/c/unit/monero_c_wallet_keys_unit_tests build/tests/c/unit/monero_c_wallet_offline_unit_tests build/tests/c/unit/monero_c_wallet_multisig_unit_tests build/tests/c/unit/monero_c_rpc_connection_unit_tests build/tests/c/unit/monero_c_abi_unit_tests build/tests/c/unit/monero_c_cpp_unit_tests build/tests/c/integration/monero_c_wallet_integration_tests dist/

      - name: Upload monero-c build
        uses: actions/upload-artifact@v7
        with:
          name: monero-c-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

      - name: Build monero-c with coverage
        if: env.COVERAGE == 'true'
        run: |
          cmake -S . -B build-coverage -DBUILD_TESTS=ON -DENABLE_COVERAGE=ON -DBOOST_ROOT=/usr/local -DBoost_NO_SYSTEM_PATHS=ON
          cmake --build build-coverage -j3

      - name: Build monerod for the integration tests
        if: env.COVERAGE == 'true'
        run: |
          cd external/monero-cpp/external/monero-project/build/release
          make -j3 daemon

      - name: Run tests with coverage
        if: env.COVERAGE == 'true'
        run: |
          # regtest monerod with the same settings as tests/c/integration/docker-compose.yml
          mkdir -p "$RUNNER_TEMP/regtest"
          external/monero-cpp/external/monero-project/build/release/bin/monerod --regtest --offline --fixed-difficulty=1 --non-interactive --log-level=0 --hide-my-port --no-zmq --rpc-bind-ip=127.0.0.1 --rpc-bind-port=18081 --rpc-access-control-origins=* --rpc-ssl=disabled --disable-rpc-ban --p2p-bind-port=18080 --no-igd --data-dir "$RUNNER_TEMP/regtest" &
          node_pid=$!
          for _ in $(seq 1 60); do
            if curl -fsS -m 5 -X POST http://127.0.0.1:18081/json_rpc -d '{"jsonrpc":"2.0","id":"0","method":"get_block_count"}' | grep -q '"count"'; then break; fi
            sleep 2
          done
          build-coverage/tests/c/unit/monero_c_utils_unit_tests
          build-coverage/tests/c/unit/monero_c_daemon_unit_tests
          build-coverage/tests/c/unit/monero_c_wallet_unit_tests
          build-coverage/tests/c/unit/monero_c_wallet_keys_unit_tests
          build-coverage/tests/c/unit/monero_c_wallet_offline_unit_tests
          build-coverage/tests/c/unit/monero_c_wallet_multisig_unit_tests
          build-coverage/tests/c/unit/monero_c_rpc_connection_unit_tests
          build-coverage/tests/c/unit/monero_c_abi_unit_tests
          build-coverage/tests/c/unit/monero_c_cpp_unit_tests
          MONERO_C_TEST_DAEMON_URI=http://127.0.0.1:18081 build-coverage/tests/c/integration/monero_c_daemon_integration_tests
          MONERO_C_TEST_DAEMON_URI=http://127.0.0.1:18081 build-coverage/tests/c/integration/monero_c_wallet_integration_tests
          kill "$node_pid"

      - name: Generate coverage report
        if: env.COVERAGE == 'true'
        run: |
          apt-get install -y lcov
          cd build-coverage
          lcov --capture --directory . --ignore-errors gcov,source --output-file coverage_full.info
          lcov --extract coverage_full.info "$GITHUB_WORKSPACE/src/*" --output-file coverage.info
          genhtml coverage.info --output-directory coverage_html --title "monero-c coverage @ $(printf '%.7s' "$GITHUB_SHA")"
          sed -i "s|$GITHUB_WORKSPACE/||g" coverage.info
          lcov --summary coverage.info

      - name: Stage coverage report
        if: env.COVERAGE == 'true'
        run: |
          mkdir -p coverage-report
          cp build-coverage/coverage.info coverage-report/
          cp -r build-coverage/coverage_html coverage-report/

      - name: Upload coverage report
        if: env.COVERAGE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: coverage-report/
          if-no-files-found: error
          retention-days: 7

      # sanitizers on monero_c only, the static archives aren't instrumented
      - name: Build monero-c with sanitizers
        if: env.COVERAGE == 'true'
        run: |
          flags="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined"
          cmake -S . -B build-sanitizers -DBUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug -DBOOST_ROOT=/usr/local -DBoost_NO_SYSTEM_PATHS=ON \
            "-DCMAKE_C_FLAGS=$flags" "-DCMAKE_CXX_FLAGS=$flags" \
            "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined" "-DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=address,undefined"
          cmake --build build-sanitizers -j3

      - name: Run unit tests with sanitizers
        if: env.COVERAGE == 'true'
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          LSAN_OPTIONS: suppressions=tests/c/sanitizers/lsan.supp
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          for test in utils daemon wallet wallet_keys wallet_offline wallet_multisig rpc_connection abi cpp; do
            build-sanitizers/tests/c/unit/monero_c_${test}_unit_tests
          done
