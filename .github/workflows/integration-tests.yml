# The library against a real regtest node and a monero-wallet-rpc server, and collects coverage from the unit and integration tests. It also runs
# the integration tests with sanitizers against a node of its own. The tests that need no daemon are in unit-tests.yml
name: Integration tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: integration-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  wait-build:
    name: Pending
    uses: ./.github/workflows/wait-build.yml
    with:
      artifacts: monero-c-linux-x86_64 build-sanitizers-linux-x86_64 build-coverage-linux-x86_64

  integration:
    name: Linux x86_64 (regtest node)
    needs: wait-build
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      MONERO_C_TEST_DAEMON_URI: http://127.0.0.1:18081
      MONERO_C_TEST_WALLET_RPC_URI: http://127.0.0.1:18082

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download monero-c build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: monero-c-linux-x86_64
          path: artifact
          run-id: ${{ needs.wait-build.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libsodium23 libunbound8
          ldd_out=$(ldd artifact/libmonero_c.so || true)
          if printf '%s\n' "$ldd_out" | grep -q 'not found'; then
            echo "$ldd_out"
            echo "missing runtime libraries above"; exit 1
          fi

      - name: Start regtest monerod and monero-wallet-rpc
        run: docker compose -f tests/c/integration/docker-compose.yml up -d

      - name: Wait for monerod
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS -m 5 -X POST "$MONERO_C_TEST_DAEMON_URI/json_rpc" -d '{"jsonrpc":"2.0","id":"0","method":"get_block_count"}' | grep -q '"count"'; then
              exit 0
            fi
            sleep 2
          done
          echo "monerod did not answer"; exit 1

      - name: Wait for monero-wallet-rpc
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS -m 5 -X POST "$MONERO_C_TEST_WALLET_RPC_URI/json_rpc" -d '{"jsonrpc":"2.0","id":"0","method":"get_version"}' | grep -q '"version"'; then
              exit 0
            fi
            sleep 2
          done
          echo "monero-wallet-rpc did not answer"; exit 1

      - name: Run integration tests
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/artifact
        run: |
          chmod +x artifact/monero_c_daemon_integration_tests artifact/monero_c_wallet_integration_tests
          artifact/monero_c_daemon_integration_tests
          artifact/monero_c_wallet_integration_tests

      - name: Show monerod and monero-wallet-rpc logs on failure
        if: failure()
        run: docker compose -f tests/c/integration/docker-compose.yml logs

      - name: Stop regtest monerod and monero-wallet-rpc
        if: always()
        run: docker compose -f tests/c/integration/docker-compose.yml down -v

  coverage:
    name: Coverage (Linux x86_64)
    needs: wait-build
    runs-on: ubuntu-24.04
    # gcov must match the compiler in the build artifact. This container has no docker daemon, so use the static monerod from docker-monero-rpc.
    container: debian:12
    timeout-minutes: 60

    steps:
      - name: Install git and the libraries of the build
        timeout-minutes: 15
        run: |
          # a run of Linux arm64 stayed on this step for more than 30 minutes (run 42739498377). apt tries again, over IPv4, with timeouts, and a try that hangs
          # is stopped and made again
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::ForceIPv4 "true";\n' > /etc/apt/apt.conf.d/80-ci
          for attempt in 1 2 3; do
            timeout 300 apt-get update && timeout 900 apt-get install -y git ca-certificates curl make gcc lcov skopeo jq zstd libzmq3-dev libunbound-dev libsodium-dev libunwind-dev liblzma-dev libreadline-dev libexpat1-dev libpgm-dev libhidapi-dev libusb-1.0-0-dev libprotobuf-dev libudev-dev nettle-dev libevent-dev && break
            [ "$attempt" -lt 3 ] || { echo "apt failed three times"; exit 1; }
            echo "apt failed, a new try in 20 seconds"; sleep 20
          done
          git config --global --add safe.directory '*'

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the coverage build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-coverage-linux-x86_64
          path: .
          run-id: ${{ needs.wait-build.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # gcov warns when a source file is newer than its notes, and the checkout is newer than the build
      - name: Check runtime dependencies
        run: |
          chmod +x build-coverage/tests/c/unit/* build-coverage/tests/c/integration/*
          find build-coverage -name '*.gcno' -exec touch {} +
          ldd_out=$(ldd build-coverage/libmonero_c.so || true)
          if printf '%s\n' "$ldd_out" | grep -q 'not found'; then
            echo "$ldd_out"
            echo "missing runtime libraries above"; exit 1
          fi

      - name: Get monerod
        env:
          # the tag of tests/c/integration/docker-compose.yml
          MONERO_TAG: master
        run: |
          skopeo copy "docker://ghcr.io/libmonero/monero-daemon-rpc:$MONERO_TAG" dir:node-image
          mkdir node
          for layer in $(jq -r '.layers[].digest' node-image/manifest.json | sed 's/^sha256://'); do
            tar -xf "node-image/$layer" -C node --wildcards 'usr/local/bin/monerod' 2>/dev/null || true
          done
          test -x node/usr/local/bin/monerod
          node/usr/local/bin/monerod --version

      - name: Run tests with coverage
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/build-coverage
        run: |
          # regtest monerod with the same settings as tests/c/integration/docker-compose.yml
          mkdir -p "$RUNNER_TEMP/regtest"
          node/usr/local/bin/monerod --regtest --offline --fixed-difficulty=1 --non-interactive --log-level=0 --hide-my-port --no-zmq --rpc-bind-ip=127.0.0.1 --rpc-bind-port=18081 --rpc-access-control-origins=* --rpc-ssl=disabled --disable-rpc-ban --p2p-bind-port=18080 --no-igd --data-dir "$RUNNER_TEMP/regtest" &
          node_pid=$!
          # stop the node, and wait until it has gone, also when a test fails and the step exits
          trap 'kill "$node_pid" 2>/dev/null || true; wait "$node_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            if curl -fsS -m 5 -X POST http://127.0.0.1:18081/json_rpc -d '{"jsonrpc":"2.0","id":"0","method":"get_block_count"}' | grep -q '"count"'; then break; fi
            sleep 2
          done
          make unit-test TEST_DIR=build-coverage
          make integration-test TEST_DIR=build-coverage DAEMON_URI=http://127.0.0.1:18081

      - name: Generate coverage report
        run: |
          make coverage-report COVERAGE_TITLE="monero-c coverage @ $(printf '%.7s' "$GITHUB_SHA")"
          sed -i "s|$GITHUB_WORKSPACE/||g" build-coverage/coverage.info

      - name: Stage coverage report
        run: |
          mkdir -p coverage-report
          cp build-coverage/coverage.info coverage-report/
          cp -r build-coverage/coverage_html coverage-report/

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-reports
          path: coverage-report/
          if-no-files-found: error
          retention-days: 7

  integration-sanitizers:
    name: Linux x86_64 (sanitizers, regtest node)
    needs: wait-build
    runs-on: ubuntu-24.04
    # the build was made in this image, at this path, and the sanitizers need the libasan of its compiler. A container job has no docker daemon,
    # so the node is the monerod of the image of docker-monero-rpc, a static binary, which skopeo reads without one
    container: debian:12
    timeout-minutes: 60

    steps:
      - name: Install git and the libraries of the build
        timeout-minutes: 15
        run: |
          # a run of Linux arm64 stayed on this step for more than 30 minutes (run 42739498377). apt tries again, over IPv4, with timeouts, and a try that hangs
          # is stopped and made again
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::ForceIPv4 "true";\n' > /etc/apt/apt.conf.d/80-ci
          for attempt in 1 2 3; do
            timeout 300 apt-get update && timeout 900 apt-get install -y git ca-certificates curl make gcc skopeo jq zstd libzmq3-dev libunbound-dev libsodium-dev libunwind-dev liblzma-dev libreadline-dev libexpat1-dev libpgm-dev libhidapi-dev libusb-1.0-0-dev libprotobuf-dev libudev-dev nettle-dev libevent-dev && break
            [ "$attempt" -lt 3 ] || { echo "apt failed three times"; exit 1; }
            echo "apt failed, a new try in 20 seconds"; sleep 20
          done
          git config --global --add safe.directory '*'

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the sanitizers build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-sanitizers-linux-x86_64
          path: .
          run-id: ${{ needs.wait-build.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check runtime dependencies
        run: |
          chmod +x build-sanitizers/tests/c/unit/* build-sanitizers/tests/c/integration/*
          ldd_out=$(ldd build-sanitizers/libmonero_c.so || true)
          if printf '%s\n' "$ldd_out" | grep -q 'not found'; then
            echo "$ldd_out"
            echo "missing runtime libraries above"; exit 1
          fi

      - name: Get monerod
        env:
          # the tag of tests/c/integration/docker-compose.yml
          MONERO_TAG: master
        run: |
          skopeo copy "docker://ghcr.io/libmonero/monero-daemon-rpc:$MONERO_TAG" dir:node-image
          mkdir node
          for layer in $(jq -r '.layers[].digest' node-image/manifest.json | sed 's/^sha256://'); do
            tar -xf "node-image/$layer" -C node --wildcards 'usr/local/bin/monerod' 2>/dev/null || true
          done
          test -x node/usr/local/bin/monerod
          node/usr/local/bin/monerod --version

      # the unit tests need no node, so the leaks of the results that a node produces only show here
      - name: Run integration tests with sanitizers
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/build-sanitizers
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          LSAN_OPTIONS: suppressions=tests/c/sanitizers/lsan.supp
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          # regtest monerod with the same settings as tests/c/integration/docker-compose.yml
          mkdir -p "$RUNNER_TEMP/regtest-sanitizers"
          node/usr/local/bin/monerod --regtest --offline --fixed-difficulty=1 --non-interactive --log-level=0 --hide-my-port --no-zmq --rpc-bind-ip=127.0.0.1 --rpc-bind-port=18081 --rpc-access-control-origins=* --rpc-ssl=disabled --disable-rpc-ban --p2p-bind-port=18080 --no-igd --data-dir "$RUNNER_TEMP/regtest-sanitizers" &
          node_pid=$!
          # stop the node, and wait until it has gone, also when a test fails and the step exits
          trap 'kill "$node_pid" 2>/dev/null || true; wait "$node_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            if curl -fsS -m 5 -X POST http://127.0.0.1:18081/json_rpc -d '{"jsonrpc":"2.0","id":"0","method":"get_block_count"}' | grep -q '"count"'; then break; fi
            sleep 2
          done
          make integration-test TEST_DIR=build-sanitizers
