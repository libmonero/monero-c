# Called by build.yml after the macOS builds. Makes the universal XCFramework of the two builds, zips it, and checks it on a Mac: a C program and a
# Swift program build against it and print the ABI version. The release workflow adds the zip to the draft release
name: Apple XCFramework

on:
  workflow_call:

permissions:
  contents: read

jobs:
  xcframework:
    name: XCFramework
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download macOS x64 native build
        uses: actions/download-artifact@v8
        with:
          name: monero-c-mac-x86_64
          path: artifacts/mac-x86_64

      - name: Download macOS ARM64 native build
        uses: actions/download-artifact@v8
        with:
          name: monero-c-mac-arm64
          path: artifacts/mac-arm64

      # only the Linux build collects the notices
      - name: Download the Linux build for its notices
        uses: actions/download-artifact@v8
        with:
          name: monero-c-linux-x86_64
          path: artifacts/linux

      - name: Read the versions
        run: |
          version=$(dotnet msbuild packaging/dotnet-core/monero.pkgproj -getProperty:MoneroNativeVersion)
          test -n "$version" || { echo "no version in packaging/dotnet-core/Version.props"; exit 1; }
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
          echo "MONERO_C_ABI_VERSION=$(awk '/#define MONERO_C_ABI_VERSION_(MAJOR|MINOR|PATCH)/ {printf "%s%s", sep, $3; sep="."}' src/utils/monero_c_utils.h)" >> "$GITHUB_ENV"

      - name: Check the tag matches the package version
        if: github.ref_type == 'tag'
        run: |
          [ "${GITHUB_REF_NAME#v}" = "$PACKAGE_VERSION" ] || { echo "tag $GITHUB_REF_NAME does not match package version $PACKAGE_VERSION"; exit 1; }

      - name: Stage the license texts
        run: cp -R artifacts/linux/licenses packaging/common/

      - name: Make the XCFramework
        run: bash packaging/apple/build-xcframework.sh "$PACKAGE_VERSION" packaging/apple/packages artifacts/mac-x86_64 artifacts/mac-arm64

      - name: Check the XCFramework
        run: bash packaging/apple/check-xcframework.sh "packaging/apple/packages/MoneroC-$PACKAGE_VERSION.xcframework.zip" "$MONERO_C_ABI_VERSION"

      - name: Upload the XCFramework
        uses: actions/upload-artifact@v7
        with:
          name: monero-native-apple
          path: packaging/apple/packages/MoneroC-${{ env.PACKAGE_VERSION }}.xcframework.zip
          if-no-files-found: error
