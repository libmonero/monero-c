name: Docs

# Builds the docs after integration tests, and publishes them with the coverage report from main only.
on:
  workflow_run:
    workflows:
      - Integration tests
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'pull_request' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Build docs
        run: doxygen Doxyfile

      # the README is the main page and refers to these files, which Doxygen does not copy
      - name: Copy the files that the README refers to
        run: |
          mkdir -p docs/html/docs
          cp docs/architecture.png docs/monero-spec.pdf docs/html/docs/
          cp donate.png docs/html/

      - name: Download coverage report
        id: coverage
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: coverage-reports
          path: coverage-reports
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id || github.run_id }}

      - name: Add coverage report to the docs
        if: steps.coverage.outcome == 'success'
        run: |
          mkdir -p docs/html/coverage
          cp -r coverage-reports/coverage_html/. docs/html/coverage/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/html

  deploy:
    needs: build
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
