name: Docs

# Called from coverage.yml. Builds the docs on pull requests, and publishes them with the coverage report from main only.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Build docs
        run: doxygen Doxyfile

      # the README is the main page and refers to these files, which Doxygen does not copy
      - name: Copy the files that the README refers to
        run: |
          mkdir -p docs/html/docs
          cp docs/architecture.png docs/monero-spec.pdf docs/html/docs/
          cp donate.png docs/html/

      # only when called from coverage.yml. A manual run publishes the docs without coverage.
      - name: Download coverage report
        id: coverage
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: coverage-reports
          path: coverage-reports

      - name: Add coverage report to the docs
        if: steps.coverage.outcome == 'success'
        run: |
          mkdir -p docs/html/coverage
          cp -r coverage-reports/coverage_html/. docs/html/coverage/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/html

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
