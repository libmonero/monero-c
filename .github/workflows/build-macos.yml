# The macOS build of the library. Called by build.yml
name: Build macOS

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.cpu }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      # every project gets ccache as the compiler launcher, and monero-project's own detection of it is turned off, so that it is not wrapped twice
      CMAKE_CCACHE: -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPRESS: "1"

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: mac-arm64
            cpu: arm64
            march: armv8-a
          - os: macos-15-intel
            arch: mac-x86_64
            cpu: x86_64
            march: x86-64

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install ccache libsodium openssl@3 zmq libpgm miniupnpc expat libunwind-headers protobuf libevent libnghttp2
          # openssl is openssl@4 on newer images, which Boost.Asio does not build with, and monero-project and monero-cpp take the prefix of openssl
          # from brew unless it is given
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          # the newer images also link openssl@4 into brew's prefix, so its headers come before the ones of openssl@3 when another library puts
          # the prefix in the include path (/opt/homebrew on arm64, /usr/local on intel, where boost is installed too): unlink it
          brew unlink openssl@4 || true
          # record versions of the brew libraries that get statically linked into the shipped binary
          brew list --versions | sort

      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-${{ matrix.arch }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ matrix.arch }}-

      # the statistics are kept in the cache directory, so reset them to see what this run did
      - name: Reset the ccache statistics
        run: ccache --zero-stats

      - name: Install libusb 1.0.27
        run: |
          # ccache wraps the compilers, which the links in the libexec of its formula stand for
          ccache_links="$(brew --prefix ccache)/libexec"
          if [ -d "$ccache_links" ]; then
            export PATH="$ccache_links:$PATH"
          else
            echo "::warning::ccache has no links in $ccache_links, so this step is not cached"
          fi
          curl --retry 5 --retry-delay 5 --retry-max-time 150 -fsSLO https://github.com/libusb/libusb/releases/download/v1.0.27/libusb-1.0.27.tar.bz2
          echo "ffaa41d741a8a3bee244ac8e54a72ea05bf2879663c098c82fc5757853441575  libusb-1.0.27.tar.bz2" | shasum -a 256 -c
          tar -xf libusb-1.0.27.tar.bz2
          cd libusb-1.0.27
          # Dart's native-assets bundler rewrites install names to its temporary bundle directory.
          export LDFLAGS="${LDFLAGS:-} -Wl,-headerpad_max_install_names"
          ./configure --prefix=/usr/local --disable-static --enable-shared --disable-udev --with-pic
          make
          sudo make install
          test -s /usr/local/lib/libusb-1.0.0.dylib

      - name: Install unbound
        run: |
          # ccache wraps the compilers, which the links in the libexec of its formula stand for
          ccache_links="$(brew --prefix ccache)/libexec"
          if [ -d "$ccache_links" ]; then
            export PATH="$ccache_links:$PATH"
          else
            echo "::warning::ccache has no links in $ccache_links, so this step is not cached"
          fi
          # the unbound of brew is built with openssl@4 and needs symbols that openssl@3 does not have, so build it, as on Linux, with openssl@3
          curl --retry 5 --retry-delay 5 --retry-max-time 150 -fsSLO https://www.nlnetlabs.nl/downloads/unbound/unbound-1.22.0.tar.gz
          echo "c5dd1bdef5d5685b2cedb749158dd152c52d44f65529a34ac15cd88d4b1b3d43  unbound-1.22.0.tar.gz" | shasum -a 256 -c
          tar xzf unbound-1.22.0.tar.gz
          cd unbound-1.22.0
          # brew's prefix and not /usr/local: monero-cpp and monero-c have no include path for libsodium, and get the one of brew from the
          # include directory of unbound, which was the prefix of brew when unbound came from there
          ./configure --prefix="$(brew --prefix)" --with-libexpat="$(brew --prefix expat)" --with-ssl="$OPENSSL_ROOT_DIR" --enable-static --disable-shared --with-pic
          make -j3
          sudo make install
          test -s "$(brew --prefix)/lib/libunbound.a"

      - name: Install hidapi (static)
        run: |
          # brew has no static hidapi, so build it from source to get a standalone library
          curl --retry 5 --retry-delay 5 --retry-max-time 150 -fsSLO https://github.com/libusb/hidapi/archive/refs/tags/hidapi-0.14.0.tar.gz
          echo "a5714234abe6e1f53647dd8cba7d69f65f71c558b7896ed218864ffcf405bcbd  hidapi-0.14.0.tar.gz" | shasum -a 256 -c
          tar xzf hidapi-0.14.0.tar.gz
          cd hidapi-hidapi-0.14.0
          cmake -B build -DBUILD_SHARED_LIBS=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DCMAKE_POLICY_VERSION_MINIMUM=3.5 .
          cmake --build build
          sudo cmake --install build

      # Boost is the same on every run, and ccache only helps with its compilation, not with the download, the extraction and the installation of
      # its headers. So it is installed in a directory of its own, which is cached, and then copied to /usr/local.
      # The number of the key is raised when the options of b2 or the deployment target change
      - name: Restore boost
        id: boost
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: boost-install
          key: boost-1.85.0-${{ matrix.arch }}-1

      - name: Install boost
        if: steps.boost.outputs.cache-hit != 'true'
        run: |
          # ccache wraps the compilers, which the links in the libexec of its formula stand for
          ccache_links="$(brew --prefix ccache)/libexec"
          if [ -d "$ccache_links" ]; then
            export PATH="$ccache_links:$PATH"
          else
            echo "::warning::ccache has no links in $ccache_links, so this step is not cached"
          fi
          # brew has no static boost, so build it from source at the 11.0 deployment target
          curl --retry 5 --retry-delay 5 --retry-max-time 150 -fsSLO https://archives.boost.io/release/1.85.0/source/boost_1_85_0.tar.bz2
          echo "7009fe1faa1697476bdc7027703a2badb84e849b7b0baad5086b087b971f8617  boost_1_85_0.tar.bz2" | shasum -a 256 -c
          tar xf boost_1_85_0.tar.bz2
          cd boost_1_85_0
          ./bootstrap.sh --with-libraries=chrono,date_time,filesystem,locale,program_options,regex,serialization,system,thread
          # the prefix is in the workspace, so that no root is needed to build it and to cache it
          ./b2 -j3 --prefix="$GITHUB_WORKSPACE/boost-install" cxxflags=-fPIC cflags=-fPIC link=static runtime-link=shared boost.locale.icu=off install

      # only main saves, as it does for ccache. The cache is saved here and not at the end, so that a later failure does not lose it
      - name: Save boost
        if: ${{ steps.boost.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: boost-install
          key: boost-1.85.0-${{ matrix.arch }}-1

      - name: Put boost in /usr/local
        run: sudo cp -R boost-install/. /usr/local/

      - name: Build monero-project
        run: |
          cd external/monero-cpp/external/monero-project
          mkdir -p build/release
          cd build/release
          cmake -DSTATIC=ON -DBUILD_64=ON -DARCH="${{ matrix.march }}" -DCMAKE_BUILD_TYPE=Release -DUSE_DEVICE_TREZOR=OFF -DOPENSSL_ROOT_DIR="$OPENSSL_ROOT_DIR" $CMAKE_CCACHE -DUSE_CCACHE=OFF ../../
          make -j3 wallet cryptonote_protocol
          cd ../../../../../../

      - name: Build monero-cpp libraries
        run: |
          cd external/monero-cpp
          mkdir -p build
          cd build
          cmake -DBUILD_LIBRARY=ON -DBUILD_SAMPLE=OFF -DBUILD_SCRATCHPAD=OFF -DBUILD_TESTS=OFF -DBOOST_ROOT=/usr/local -DBoost_NO_SYSTEM_PATHS=ON -DOPENSSL_ROOT_DIR="$OPENSSL_ROOT_DIR" $CMAKE_CCACHE ..
          cmake --build . --target monero-cpp-static -j3
          cd ../../..

      - name: Build monero-c library
        run: |
          mkdir -p build
          cd build
          cmake -DBUILD_TESTS=ON -DMONERO_C_STATIC_DEPENDENCIES=ON -DMONERO_C_LIBUSB_SHARED_LIBRARY:FILEPATH=/usr/local/lib/libusb-1.0.0.dylib -DBOOST_ROOT=/usr/local -DBoost_NO_SYSTEM_PATHS=ON -DOPENSSL_ROOT_DIR="$OPENSSL_ROOT_DIR" $CMAKE_CCACHE ..
          grep -Fxq 'MONERO_C_LIBUSB_SHARED_LIBRARY:FILEPATH=/usr/local/lib/libusb-1.0.0.dylib' CMakeCache.txt
          cmake --build . -j3
          cd ..

      - name: Relocate bundled libusb
        run: |
          dependency=$(otool -L build/libmonero_c.dylib | awk '/libusb-1.0/ {print $1; exit}')
          test -n "$dependency" || { echo "libusb is not dynamically linked"; exit 1; }
          install_name_tool -change "$dependency" "@loader_path/libusb-1.0.0.dylib" build/libmonero_c.dylib

      - name: Stage monero-c build
        run: |
          mkdir -p dist
          cp build/libmonero_c.dylib dist/
          cp /usr/local/lib/libusb-1.0.0.dylib dist/
          cp build/tests/c/unit/monero_c_utils_unit_tests build/tests/c/unit/monero_c_daemon_unit_tests dist/
          cp build/tests/c/unit/monero_c_wallet_unit_tests build/tests/c/unit/monero_c_wallet_keys_unit_tests build/tests/c/unit/monero_c_wallet_offline_unit_tests build/tests/c/unit/monero_c_wallet_multisig_unit_tests build/tests/c/unit/monero_c_rpc_connection_unit_tests build/tests/c/unit/monero_c_abi_unit_tests build/tests/c/unit/monero_c_arguments_unit_tests build/tests/c/unit/monero_c_fuzz_unit_tests build/tests/c/unit/monero_c_threads_unit_tests build/tests/c/unit/monero_c_cpp_unit_tests dist/

      - name: Upload monero-c build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: monero-c-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

      - name: Show the ccache statistics
        if: ${{ !cancelled() }}
        run: ccache --show-stats

      # only main saves, so that the caches of the pull requests don't evict the one that every pull request restores
      - name: Save ccache
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-${{ matrix.arch }}-${{ github.run_id }}
