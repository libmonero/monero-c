# The tests that need no daemon, on the artifacts of the Build run of the same commit: the C unit tests of each platform, the ones of Linux again
# with the sanitizers, and the managed tests of the NuGet package. The ones that need a regtest node are in integration-tests.yml
name: Unit tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: unit-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UNIT_TESTS: utils daemon wallet wallet_keys wallet_offline wallet_multisig rpc_connection abi arguments fuzz threads cpp

jobs:
  wait-build:
    name: Pending
    uses: ./.github/workflows/wait-build.yml
    with:
      artifacts: monero-c-linux-x86_64 monero-c-linux-arm64 monero-c-mac-x86_64 monero-c-mac-arm64 monero-c-windows monero-native-nuget build-sanitizers-linux-x86_64

  unit-linux:
    name: ${{ matrix.platform }}
    needs: wait-build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux x86_64
            os: ubuntu-24.04
            artifact: linux-x86_64
          - platform: Linux arm64
            os: ubuntu-24.04-arm
            artifact: linux-arm64

    steps:
      - name: Download monero-c build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: monero-c-${{ matrix.artifact }}
          path: artifact
          run-id: ${{ needs.wait-build.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libsodium23 libunbound8
          ldd_out=$(ldd artifact/libmonero_c.so || true)
          if printf '%s\n' "$ldd_out" | grep -q 'not found'; then
            echo "$ldd_out"
            echo "missing runtime libraries above"; exit 1
          fi

      - name: Run unit tests
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/artifact
        run: |
          for test in $UNIT_TESTS; do
            chmod +x "artifact/monero_c_${test}_unit_tests"
            "artifact/monero_c_${test}_unit_tests" || exit 1
          done

  unit-macos:
    name: ${{ matrix.platform }}
    needs: wait-build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS arm64
            os: macos-15
            artifact: mac-arm64
          - platform: macOS x86_64
            os: macos-15-intel
            artifact: mac-x86_64

    steps:
      - name: Download monero-c build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: monero-c-${{ matrix.artifact }}
          path: artifact
          run-id: ${{ needs.wait-build.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install runtime libraries
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install libsodium openssl@3 libusb unbound
          # the library links these Homebrew dylibs, so each one must exist before the tests run
          for dep in $(otool -L artifact/libmonero_c.dylib | tail -n +2 | awk '{print $1}'); do
            case "$dep" in
              @rpath/*|/usr/lib/*|/System/Library/*) ;;
              @loader_path/*)
                resolved_dep="artifact/${dep#@loader_path/}"
                test -e "$resolved_dep" || { echo "missing dependency: $dep ($resolved_dep)"; exit 1; }
                ;;
              *) test -e "$dep" || { echo "missing dependency: $dep"; exit 1; } ;;
            esac
          done

      - name: Run unit tests
        env:
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/artifact
        run: |
          for test in $UNIT_TESTS; do
            chmod +x "artifact/monero_c_${test}_unit_tests"
            "artifact/monero_c_${test}_unit_tests" || exit 1
          done

  unit-windows:
    name: Windows x86_64
    needs: wait-build
    runs-on: windows-latest
    timeout-minutes: 30

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Download monero-c build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: monero-c-windows
          path: artifact
          run-id: ${{ needs.wait-build.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # the MINGW64 packages that provide the DLLs monero_c.dll loads, the same ones the build job links. The package database is updated, as the build
      # job does: the one of the MSYS2 installer is weeks old, and a package that MSYS2 publishes again under the same name fails its checksum
      - name: Setup MSYS2 MINGW64
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc-libs
            mingw-w64-x86_64-ntldd
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-libsodium
            mingw-w64-x86_64-unbound

      - name: Check runtime dependencies
        run: |
          # ntldd reports the Windows API sets and some system DLLs as not found, so only the MinGW libraries are checked
          ntldd_out=$(ntldd -R artifact/libmonero_c.dll || true)
          if printf '%s\n' "$ntldd_out" | grep -qE '^[[:space:]]*lib[^[:space:]]*\.dll => not found'; then
            echo "$ntldd_out"
            echo "missing runtime libraries above"; exit 1
          fi

      - name: Run unit tests
        run: |
          for test in $UNIT_TESTS; do
            "artifact/monero_c_${test}_unit_tests.exe" || exit 1
          done

  unit-sanitizers:
    name: Linux x86_64 (sanitizers)
    needs: wait-build
    runs-on: ubuntu-24.04
    # the build was made in this image, at this path, and the sanitizers need the libasan of its compiler
    container: debian:12
    timeout-minutes: 60

    steps:
      - name: Install git and the libraries of the build
        timeout-minutes: 15
        run: |
          # a run of Linux arm64 stayed on this step for more than 30 minutes (run 42739498377). apt tries again, over IPv4, with timeouts, and a try that hangs
          # is stopped and made again
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::ForceIPv4 "true";\n' > /etc/apt/apt.conf.d/80-ci
          for attempt in 1 2 3; do
            timeout 300 apt-get update && timeout 900 apt-get install -y git ca-certificates make gcc libzmq3-dev libunbound-dev libsodium-dev libunwind-dev liblzma-dev libreadline-dev libexpat1-dev libpgm-dev libhidapi-dev libusb-1.0-0-dev libprotobuf-dev libudev-dev nettle-dev libevent-dev && break
            [ "$attempt" -lt 3 ] || { echo "apt failed three times"; exit 1; }
            echo "apt failed, a new try in 20 seconds"; sleep 20
          done
          git config --global --add safe.directory '*'

      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download the sanitizers build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-sanitizers-linux-x86_64
          path: .
          run-id: ${{ needs.wait-build.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check runtime dependencies
        run: |
          chmod +x build-sanitizers/tests/c/unit/* build-sanitizers/tests/c/integration/*
          ldd_out=$(ldd build-sanitizers/libmonero_c.so || true)
          if printf '%s\n' "$ldd_out" | grep -q 'not found'; then
            echo "$ldd_out"
            echo "missing runtime libraries above"; exit 1
          fi

      - name: Run unit tests with sanitizers
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/build-sanitizers
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          LSAN_OPTIONS: suppressions=tests/c/sanitizers/lsan.supp
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: make unit-test TEST_DIR=build-sanitizers

  dotnet:
    name: .NET tests
    needs: wait-build
    uses: ./.github/workflows/dotnet-tests.yml
    with:
      run-id: ${{ needs.wait-build.outputs.run-id }}
