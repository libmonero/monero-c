# Called by build.yml for a tag v*: collects what the Build workflow made into a draft GitHub release, with the library of each platform and the
# packages. Nothing is published from here. Publishing the draft by hand runs publish-nuget.yml, which pushes the package to nuget.org
# and to GitHub Packages
name: Release

on:
  workflow_call:

permissions:
  contents: read

jobs:
  draft:
    name: Draft release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the version
        run: |
          version="${GITHUB_REF_NAME#v}"
          package=$(dotnet msbuild packaging/dotnet-core/monero.pkgproj -getProperty:MoneroNativeVersion)
          [ "$version" = "$package" ] || { echo "tag $GITHUB_REF_NAME does not match package version $package"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
          case "$version" in *-*) echo "PRERELEASE=--prerelease" >> "$GITHUB_ENV" ;; esac

      # the tests don't run on tags: the commit has to be one of main whose Unit tests and Integration tests workflows passed
      - name: Check that the commit is on main and its tests passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq '.status')
          case "$state" in identical|behind) ;; *) echo "$GITHUB_SHA is not a commit of main ($state): tag a commit of main"; exit 1 ;; esac
          for workflow in unit-tests.yml integration-tests.yml; do
            passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$GITHUB_SHA&event=push&branch=main&status=success&per_page=1" --jq '.total_count')
            [ "$passed" -ge 1 ] || { echo "$workflow has no successful run on main for $GITHUB_SHA: tag a commit whose tests passed"; exit 1; }
          done

      - name: Download the builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: monero-c-*
          path: artifacts

      # the NuGet package, and the packages of the other languages. Their artifacts are called monero-native-<name>
      - name: Download the packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: monero-native-*
          merge-multiple: true
          path: release

      - name: Install archive stripping tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-aarch64-linux-gnu llvm

      - name: Pack the libraries of each platform
        run: |
          mkdir -p release
          for platform in linux-x86_64 linux-arm64 mac-x86_64 mac-arm64 windows android-arm64 android-x86_64; do
            # only the Linux build collects the notices, and they cover the components of every platform, as the NuGet package has them
            bash packaging/common/pack-archive.sh "$VERSION" "$platform" "artifacts/monero-c-$platform" artifacts/monero-c-linux-x86_64/licenses release
          done
          # the Dart package has the checksums of the archives above, so it comes after them
          bash packaging/dart/build.sh "$VERSION" release
          (cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*

      - name: Take the notes from the changelog
        run: |
          awk -v v="$VERSION" '/^## /{ if (found) exit; if ($0 == "## " v || index($0, "## " v " ") == 1) { found = 1; next } } found' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section for $VERSION"; exit 1; }

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --draft --verify-tag $PRERELEASE --title "$VERSION" --notes-file notes.md
